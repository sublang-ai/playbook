# Generic `playbook` launcher config.
# Top-level host fields only — no `config:` wrapper, no top-level `players`.
# The launcher injects captain.from and the namespaced <id>-<role> host
# players, then launches cligent's tmux-play under the Playbook Captain shell.

# Every agent — the Captain and each playbook role — carries its own
# settings inline: an adapter shorthand (claude, codex) or a block with
# adapter/model/effort/permissions. Retuning one agent never changes
# another.

# Each adapter needs its vendor SDK installed as its own top-level
# install root — they are optional peer dependencies, so you pay only
# for the vendors named below:
#   claude -> npm install -g @anthropic-ai/claude-agent-sdk
#   codex  -> npm install -g @openai/codex-sdk
# Drop an adapter from this file and you can skip its SDK entirely.
# Every seeded agent runs in cligent's protected auto mode
# (permissions.mode: auto): claude maps it to permissionMode auto, codex to
# on-request + auto_review. Codex roles also grant writablePaths: ['.git']
# so they can inspect and work with repository metadata under the sandbox.

# The Captain/Judge agent.
# Captain routing/adjudication calls run tool-free. Claude enforces that at
# the provider level; the codex adapter cannot enforce a tool list, so a
# codex captain degrades to a prompt-level restriction (DR-013 A1).
captain:
  adapter: claude
  model: claude-opus-4-8
  effort: high
  permissions:
    mode: auto

# Host notifications. Omitting turn_aborted resolves it to off.
notifications:
  player_finished: bell
  turn_finished: desktop

# Enabled playbooks. Each is loaded from its explicit `from` module; the
# `<id>` key must equal that module's manifest id. `from`, `command`, and
# `players` are launcher-owned; every other key is that playbook's option
# slice.
#
# Nested calls map roles by exact id. CODE and DECIDE call REVIEW with the
# same `coder` and `reviewer` ids, so those child roles continue the nearest
# ancestor sessions. A standalone REVIEW uses its own bindings below.
playbooks:
  code:
    from: "@sublang/playbook/code/registry"
    players:
      coder:
        adapter: claude
        model: claude-opus-4-8[1m]
        effort: xhigh
        permissions:
          mode: auto

  review:
    from: "@sublang/playbook/review/registry"
    players:
      coder:
        adapter: claude
        model: claude-opus-4-8[1m]
        effort: xhigh
        permissions:
          mode: auto
      reviewer:
        adapter: codex
        model: gpt-5.5
        effort: xhigh
        permissions:
          mode: auto
          writablePaths: ['.git']

  decide:
    from: "@sublang/playbook/decide/registry"
    players:
      coder:
        adapter: claude
        model: claude-opus-4-8[1m]
        effort: xhigh
        permissions:
          mode: auto
      reviewer:
        adapter: codex
        model: gpt-5.5
        effort: xhigh
        permissions:
          mode: auto
          writablePaths: ['.git']

# Non-interactive `playbook run` defaults (optional). Each value is an
# agent string <adapter>[:<model>][@<effort>]; `player` is the catch-all
# for any required role without its own `players.<role>` entry, across
# every playbook. Flags override per role (--player / --captain), and
# `playbook run resume` keeps the lineup stored with the parked session.
#run:
#  captain: claude:claude-opus-4-8@high
#  player: claude:claude-opus-4-8@high
#  players:
#    coder: claude:claude-opus-4-8[1m]@xhigh
