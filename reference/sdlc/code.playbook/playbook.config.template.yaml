# Shared `playbook` and `playbook run` launcher config.
# Top-level host fields only — no `config:` wrapper. The launcher injects
# captain.from, retains only players named by a role binding, and hosts the
# same Playbook Captain shell interactively or headlessly.

# The Captain and each stable session player carries its own defaults inline:
# an adapter shorthand (claude, codex) or a block with
# adapter/model/effort/fastMode/permissions. A role may override only model,
# effort, or fastMode.
# Omit an override to inherit the player default. For model and effort, false
# selects the provider default; fastMode false is a literal disabled request.

# Each adapter needs its vendor SDK installed as its own top-level
# install root — they are optional peer dependencies, so you pay only
# for the vendors named below:
#   claude -> npm install -g @anthropic-ai/claude-agent-sdk
#   codex  -> npm install -g @openai/codex-sdk
# Drop an adapter from this file and you can skip its SDK entirely.
# Every seeded agent runs in cligent's protected auto mode
# (permissions.mode: auto): claude maps it to permissionMode auto, codex to
# on-request + auto_review. A codex agent additionally needs
# writablePaths: ['.git'] to write git metadata under its sandbox.
# so they can inspect and work with repository metadata under the sandbox.

# The Captain/Judge agent.
# Captain routing/adjudication calls run tool-free. Claude and Gemini enforce
# that at the provider level; codex, kimi, and opencode cannot enforce a tool
# list, so those captains degrade to a prompt-level restriction (DR-013 A1).
captain:
  adapter: claude
  model: claude-opus-5
  effort: high
  permissions:
    mode: auto

# Interactive host notifications. Headless runs ignore presentation fields.
# Omitting turn_aborted resolves it to off.
notifications:
  player_finished: bell
  turn_finished: desktop

# Stable player ids are flat exact strings. Dots are a naming convention, not
# YAML hierarchy. Naming the same id in several role bindings deliberately
# shares one provider conversation across those playbooks.
players:
  dev.coder:
    adapter: claude
    model: claude-opus-5
    effort: high
    # Adapter-scoped fast mode is validated by the installed Cligent contract;
    # omitting it takes the provider default.
    permissions:
      mode: auto

  dev.reviewer:
    adapter: claude
    model: claude-opus-5
    effort: xhigh
    permissions:
      mode: auto

  # DEV's planner stays a distinct player: equal ids deliberately share one
  # provider conversation, and planning context must not bleed into review
  # conversations (DR-044).
  dev.analyst:
    adapter: claude
    model: claude-opus-5
    effort: xhigh
    permissions:
      mode: auto

# Enabled playbooks. Each is loaded from its explicit `from` module; the
# `<id>` key must equal that module's manifest id. `from`, `command`, and
# `roles` are launcher-owned; every other key is that playbook's option
# slice.
#
# Every manifest role is bound explicitly. CODE, REVIEW, DECIDE, BRANCH, and
# PR intentionally reuse the same two stable players, while DEV keeps its own
# Analyst; change an id to isolate its conversation.
playbooks:
  code:
    from: "@sublang/playbook/code/registry"
    roles:
      coder: dev.coder

  review:
    from: "@sublang/playbook/review/registry"
    roles:
      coder: dev.coder
      reviewer: dev.reviewer

  decide:
    from: "@sublang/playbook/decide/registry"
    roles:
      coder: dev.coder
      reviewer: dev.reviewer

  dev:
    from: "@sublang/playbook/dev/registry"
    roles:
      analyst: dev.analyst

  # Pull-request delivery for DEV (DR-050). BRANCH and PR bind Coder to the
  # same dev.coder player as CODE and REVIEW on purpose: the Coder that read
  # the issue and named the branch makes the commits and then describes
  # them in the pull request. Change an id to isolate its conversation.
  branch:
    from: "@sublang/playbook/branch/registry"
    roles:
      coder: dev.coder

  pr:
    from: "@sublang/playbook/pr/registry"
    roles:
      coder: dev.coder
