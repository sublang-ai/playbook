name: Release

on:
  push:
    # GitHub ref filters use glob syntax: `+` repeats the preceding
    # numeric character class, while each dot is literal.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: publish @sublang/playbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches package.json version
        # RELEASE-2 / RELEASE-7 step 1. Reject malformed or mismatched tags
        # before changing the checkout or spending install/build resources.
        run: node scripts/check-release-metadata.mjs --tag-only "$GITHUB_REF_NAME"

      - name: Drop dev-only workspace override
        # A local pnpm-workspace.yaml links @sublang/cligent to a
        # sibling repo on contributor machines. The release pipeline
        # installs the registry-pinned cligent from the lockfile.
        run: rm -f pnpm-workspace.yaml

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Upgrade npm for trusted-publisher OIDC support
        # OIDC trusted publishing requires npm >= 11.5; bundled npm on
        # Node 22 is older. We publish through npm directly (not
        # `pnpm publish`) so the upgraded CLI handles the OIDC token
        # exchange.
        run: npm install -g npm@11.8.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify .ts and compiled siblings are in sync
        # A release must publish the exact generated bytes committed in the
        # tag, not uncommitted output produced by the build on the runner.
        run: |
          git diff --exit-code -- \
            'reference/sdlc/captain.playbook/captain.*.js' \
            'reference/sdlc/captain.playbook/captain.*.d.ts' \
            'reference/sdlc/code.playbook/code.*.js' \
            'reference/sdlc/code.playbook/code.*.d.ts' \
            'reference/sdlc/code.playbook/playbook-captain.js' \
            'reference/sdlc/code.playbook/playbook-captain.d.ts' \
            'reference/sdlc/review.playbook/review.*.js' \
            'reference/sdlc/review.playbook/review.*.d.ts' \
            'reference/sdlc/decide.playbook/decide.*.js' \
            'reference/sdlc/decide.playbook/decide.*.d.ts' \
            'src/accepted-outcome.js' \
            'src/accepted-outcome.d.ts' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts' \
            'src/xstate-playbook-runtime.js' \
            'src/xstate-playbook-runtime.d.ts'
          if [ -n "$(git status --porcelain -- \
            'reference/sdlc/captain.playbook' \
            'reference/sdlc/code.playbook' \
            'reference/sdlc/review.playbook' \
            'reference/sdlc/decide.playbook' \
            'src/accepted-outcome.js' \
            'src/accepted-outcome.d.ts' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts' \
            'src/xstate-playbook-runtime.js' \
            'src/xstate-playbook-runtime.d.ts')" ]; then
            git status --short -- \
              'reference/sdlc/captain.playbook' \
              'reference/sdlc/code.playbook' \
              'reference/sdlc/review.playbook' \
              'reference/sdlc/decide.playbook' \
              'src/accepted-outcome.js' \
              'src/accepted-outcome.d.ts' \
              'src/runtime.js' \
              'src/runtime.d.ts' \
              'src/xstate-runtime.js' \
              'src/xstate-runtime.d.ts' \
              'src/xstate-playbook-runtime.js' \
              'src/xstate-playbook-runtime.d.ts'
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Validate release metadata and extract release notes
        # RELEASE-2 / RELEASE-7. The validator rejects non-SemVer or
        # manifest-mismatched tags and malformed dated changelog sections.
        # It writes notes directly to a file so shell-meaningful changelog
        # text remains opaque to `gh release create --notes-file`.
        run: node scripts/check-release-metadata.mjs "$GITHUB_REF_NAME" /tmp/release-notes.md

      - name: Publish to npm with provenance
        # RELEASE-8 / RELEASE-9: --provenance attaches a signed
        # attestation linking the tarball to this workflow run;
        # --access public is required for scoped packages on the
        # default npm registry.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
