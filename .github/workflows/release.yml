name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: publish @sublang/playbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Drop dev-only workspace override
        # A local pnpm-workspace.yaml links @sublang/cligent to a
        # sibling repo on contributor machines. The release pipeline
        # installs the registry-pinned cligent from the lockfile.
        run: rm -f pnpm-workspace.yaml

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify tag matches package.json version
        # RELEASE-2: tag without `v` prefix must equal package.json
        # `version`.
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Upgrade npm for trusted-publisher OIDC support
        # OIDC trusted publishing requires npm >= 11.5; bundled npm on
        # Node 22 is older. We publish through npm directly (not
        # `pnpm publish`) so the upgraded CLI handles the OIDC token
        # exchange.
        run: npm install -g npm@11.8.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify .ts and compiled siblings are in sync
        # A release must publish the exact generated bytes committed in the
        # tag, not uncommitted output produced by the build on the runner.
        run: |
          git diff --exit-code -- \
            'reference/sdlc/captain.playbook/captain.*.js' \
            'reference/sdlc/captain.playbook/captain.*.d.ts' \
            'reference/sdlc/code.playbook/code.*.js' \
            'reference/sdlc/code.playbook/code.*.d.ts' \
            'reference/sdlc/code.playbook/playbook-captain.js' \
            'reference/sdlc/code.playbook/playbook-captain.d.ts' \
            'reference/sdlc/discuss.playbook/discuss.*.js' \
            'reference/sdlc/discuss.playbook/discuss.*.d.ts' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts'
          if [ -n "$(git status --porcelain -- \
            'reference/sdlc/captain.playbook' \
            'reference/sdlc/code.playbook' \
            'reference/sdlc/discuss.playbook' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts')" ]; then
            git status --short -- \
              'reference/sdlc/captain.playbook' \
              'reference/sdlc/code.playbook' \
              'reference/sdlc/discuss.playbook' \
              'src/runtime.js' \
              'src/runtime.d.ts' \
              'src/xstate-runtime.js' \
              'src/xstate-runtime.d.ts'
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Extract release notes from CHANGELOG.md
        # RELEASE-7 step 4. Write to a file (not GITHUB_OUTPUT) so the
        # body stays opaque to later steps — `gh release create
        # --notes-file` reads it verbatim, so backticks, $(), and other
        # shell-meaningful chars in the changelog cannot be interpreted
        # as commands when the release is created.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 == "## [" ver "]" || index($0, "## [" ver "] -")) found=1; next }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! [ -s /tmp/release-notes.md ] || ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::No release notes found for version $VERSION in CHANGELOG.md"
            exit 1
          fi

      - name: Publish to npm with provenance
        # RELEASE-8 / RELEASE-9: --provenance attaches a signed
        # attestation linking the tarball to this workflow run;
        # --access public is required for scoped packages on the
        # default npm registry.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
