name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playbook:
    name: playbook (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6

      - name: Drop dev-only workspace override
        # A local pnpm-workspace.yaml links @sublang/cligent to a
        # sibling repo on contributor machines (see this package's
        # README). CI installs the registry-pinned cligent from the
        # lockfile.
        run: rm -f pnpm-workspace.yaml

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # Vitest suite covering FSM ↔ gears conformance (PLAYBOOK-*),
        # runtime behavior (PBRT-*), prompt contracts, introspect
        # helpers, and onDone arm coverage.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify .ts and compiled siblings are in sync
        # Catches drift like 7dcaa2f / e643fac where a .ts source change
        # was committed without rebuilding the .js / .d.ts that ship via
        # package.json's `files` field. The check is Node-independent,
        # so it runs on one matrix entry only.
        if: matrix.node-version == '22'
        run: |
          git diff --exit-code -- \
            'reference/sdlc/code.playbook/code.*.js' \
            'reference/sdlc/code.playbook/code.*.d.ts' \
            'reference/sdlc/code.playbook/playbook-captain.js' \
            'reference/sdlc/code.playbook/playbook-captain.d.ts' \
            'reference/sdlc/discuss.playbook/discuss.*.js' \
            'reference/sdlc/discuss.playbook/discuss.*.d.ts' \
            'src/runtime.js' \
            'src/runtime.d.ts'

  sketch:
    name: views/sketch (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: views/sketch
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: views/sketch/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  licensing:
    name: SPDX headers (LIC-3, LIC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify SPDX headers on git-tracked files
        run: bash scripts/check-spdx.sh

  smoke:
    name: Smoke install (global tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pack the publishable tarball
        # Same artifact `npm publish` would upload; uses package.json's
        # `files` array. No build step needed — `.js` / `.d.ts`
        # siblings are committed and pinned by the drift check above.
        run: npm pack --pack-destination /tmp

      - name: Global-install the tarball under a temp prefix
        # Mirrors the README's `npm install -g @sublang/playbook`.
        # --prefix points npm at a temp tree instead of the runner's
        # real global root. Global topology DOES NOT hoist between
        # separately-named top-level packages, so this is the only
        # install shape that reflects what users actually get.
        run: |
          mkdir -p /tmp/global
          npm install --prefix /tmp/global -g /tmp/sublang-playbook-*.tgz

      - name: Verify cligent is bundled under playbook
        # @sublang/cligent must be a regular dependency so it lands
        # INSIDE playbook's tree. Otherwise the SDK-resolution walk
        # from cligent's file location can't reach playbook's deps
        # (the v0.1.0 / v0.1.1 failure mode).
        run: |
          test -d /tmp/global/lib/node_modules/@sublang/playbook/node_modules/@sublang/cligent \
            || { echo "::error::cligent did not install transitively under @sublang/playbook"; exit 1; }

      - name: Probe adapter SDKs from cligent's installed location
        # The probe must run from cligent's installed dir so Node's
        # walk-up for the SDK starts at the SAME tree cligent will
        # use at runtime. Probing from anywhere else (or from a
        # hoisted local install) silently passes even when the SDK
        # is unreachable to cligent.
        run: |
          SMOKE_DIR=/tmp/global/lib/node_modules/@sublang/playbook/node_modules/@sublang/cligent
          cp scripts/smoke-adapters.mjs "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          node ./smoke-adapters.mjs
