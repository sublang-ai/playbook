name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playbook:
    name: playbook (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6

      - name: Drop dev-only workspace override
        # A local pnpm-workspace.yaml links @sublang/cligent to a
        # sibling repo on contributor machines (see this package's
        # README). CI installs the registry-pinned cligent from the
        # lockfile.
        run: rm -f pnpm-workspace.yaml

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # Vitest suite covering FSM ↔ gears conformance (PLAYBOOK-*),
        # runtime behavior (PBRT-*), prompt contracts, introspect
        # helpers, and onDone arm coverage.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify .ts and compiled siblings are in sync
        # Catches drift like 7dcaa2f / e643fac where a .ts source change
        # was committed without rebuilding the .js / .d.ts that ship via
        # package.json's `files` field. The check is Node-independent,
        # so it runs on one matrix entry only.
        if: matrix.node-version == '22'
        run: |
          git diff --exit-code -- \
            'reference/sdlc/captain.playbook/captain.*.js' \
            'reference/sdlc/captain.playbook/captain.*.d.ts' \
            'reference/sdlc/code.playbook/code.*.js' \
            'reference/sdlc/code.playbook/code.*.d.ts' \
            'reference/sdlc/code.playbook/playbook-captain.js' \
            'reference/sdlc/code.playbook/playbook-captain.d.ts' \
            'reference/sdlc/discuss.playbook/discuss.*.js' \
            'reference/sdlc/discuss.playbook/discuss.*.d.ts' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts' \
            'src/xstate-playbook-runtime.js' \
            'src/xstate-playbook-runtime.d.ts'
          if [ -n "$(git status --porcelain -- \
            'reference/sdlc/captain.playbook' \
            'reference/sdlc/code.playbook' \
            'reference/sdlc/discuss.playbook' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts' \
            'src/xstate-playbook-runtime.js' \
            'src/xstate-playbook-runtime.d.ts')" ]; then
            git status --short -- \
              'reference/sdlc/captain.playbook' \
              'reference/sdlc/code.playbook' \
              'reference/sdlc/discuss.playbook' \
              'src/runtime.js' \
              'src/runtime.d.ts' \
              'src/xstate-runtime.js' \
              'src/xstate-runtime.d.ts' \
              'src/xstate-playbook-runtime.js' \
              'src/xstate-playbook-runtime.d.ts'
            exit 1
          fi

  sketch:
    name: views/sketch (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: views/sketch
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: views/sketch/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  licensing:
    name: SPDX headers (LIC-3, LIC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify SPDX headers on git-tracked files
        run: bash scripts/check-spdx.sh

  smoke:
    name: Smoke install (global tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pack the publishable tarball
        # Same artifact `npm publish` would upload; uses package.json's
        # `files` array. No build step needed — `.js` / `.d.ts`
        # siblings are committed and pinned by the drift check above.
        run: npm pack --pack-destination /tmp

      # RELEASE-13 shape 1 — LEAN: the tarball alone.
      # --prefix points npm at a temp tree instead of the runner's real
      # global root. Global topology DOES NOT hoist between separately-named
      # top-level packages, so only these shapes reflect what users get; an
      # in-repo or project-local install hoists the SDK flat and passes
      # regardless, which is why no in-repo test ever caught DR-026's bug.
      - name: Global-install the tarball alone under a temp prefix
        run: |
          mkdir -p /tmp/lean
          npm install --prefix /tmp/lean -g /tmp/sublang-playbook-*.tgz

      - name: Verify cligent is bundled under playbook
        # @sublang/cligent must be a regular dependency so it lands
        # INSIDE playbook's tree. Otherwise the SDK-resolution walk
        # from cligent's file location can't reach playbook's deps
        # (the v0.1.0 / v0.1.1 failure mode).
        run: |
          test -d /tmp/lean/lib/node_modules/@sublang/playbook/node_modules/@sublang/cligent \
            || { echo "::error::cligent did not install transitively under @sublang/playbook"; exit 1; }

      - name: Verify no agent SDK stack ships with a bare install
        # DR-026: the SDKs are optional peers. A bare install carrying an
        # agent stack is the 466 MB footprint regression (slc#6).
        run: |
          found=$(find /tmp/lean/lib/node_modules \
            \( -type d -name '@anthropic-ai' -o -type d -name '@openai' \) -print)
          if [ -n "$found" ]; then
            echo "::error::a bare install shipped an agent SDK stack:"
            echo "$found"
            exit 1
          fi

      - name: Probe adapters from cligent's installed location — expect none
        # The probe must run from cligent's installed dir so Node's
        # walk-up for the SDK starts at the SAME tree cligent will
        # use at runtime. Probing from anywhere else (or from a
        # hoisted local install) silently passes even when the SDK
        # is unreachable to cligent.
        run: |
          SMOKE_DIR=/tmp/lean/lib/node_modules/@sublang/playbook/node_modules/@sublang/cligent
          cp scripts/smoke-adapters.mjs "$SMOKE_DIR/"
          (cd "$SMOKE_DIR" && node ./smoke-adapters.mjs unavailable)

      # RELEASE-13 shape 2 — OPTED-IN: the documented install command.
      # Each SDK is named as its OWN top-level global root, which places it
      # on the directory-ancestor walk from the nested cligent. An SDK
      # nested inside a sibling root's subtree is unreachable instead
      # (DR-026 §3) — that difference is the whole of slc#1.
      - name: Global-install the tarball plus both SDKs as sibling roots
        run: |
          mkdir -p /tmp/optin
          npm install --prefix /tmp/optin -g \
            /tmp/sublang-playbook-*.tgz \
            @anthropic-ai/claude-agent-sdk \
            @openai/codex-sdk

      - name: Probe adapters from cligent's installed location — expect both
        run: |
          SMOKE_DIR=/tmp/optin/lib/node_modules/@sublang/playbook/node_modules/@sublang/cligent
          cp scripts/smoke-adapters.mjs "$SMOKE_DIR/"
          (cd "$SMOKE_DIR" && node ./smoke-adapters.mjs available)

      # RELEASE-13 shapes 3 and 4 — EPHEMERAL: the npx / npm exec tree.
      # npm materializes the run in a cache tree whose ancestor walk touches
      # no global prefix, so no install command reaches it. The bare tree must
      # therefore probe unavailable, and the documented multi-package form —
      # each SDK a sibling package of one invocation — must probe available.
      # In an exec tree npm hoists flat, so cligent sits at the tree root.
      - name: Probe the bare exec tree — expect none
        run: |
          export npm_config_cache=/tmp/npxcache
          BIN=$(npm exec --yes --package=/tmp/sublang-playbook-*.tgz --call 'command -v playbook')
          SMOKE_DIR="$(dirname "$(dirname "$BIN")")/@sublang/cligent"
          cp scripts/smoke-adapters.mjs "$SMOKE_DIR/"
          (cd "$SMOKE_DIR" && node ./smoke-adapters.mjs unavailable)

      - name: Probe the multi-package exec tree — expect both
        run: |
          export npm_config_cache=/tmp/npxcache
          BIN=$(npm exec --yes \
            --package=/tmp/sublang-playbook-*.tgz \
            --package=@anthropic-ai/claude-agent-sdk \
            --package=@openai/codex-sdk \
            --call 'command -v playbook')
          SMOKE_DIR="$(dirname "$(dirname "$BIN")")/@sublang/cligent"
          cp scripts/smoke-adapters.mjs "$SMOKE_DIR/"
          (cd "$SMOKE_DIR" && node ./smoke-adapters.mjs available)
