name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per pull-request head: a push cancels the run it supersedes;
# a push to main cancels nothing (release-41).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playbook:
    name: playbook (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6

      - name: Drop dev-only workspace override
        # A local pnpm-workspace.yaml links @sublang/cligent to a
        # sibling repo on contributor machines (see this package's
        # README). CI installs the registry-pinned cligent from the
        # lockfile.
        run: rm -f pnpm-workspace.yaml

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # Vitest suite covering FSM ↔ gears conformance (PLAYBOOK-*),
        # runtime behavior (PBRT-*), prompt contracts, introspect
        # helpers, and onDone arm coverage.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify .ts and compiled siblings are in sync
        # Catches drift like 7dcaa2f / e643fac where a .ts source change
        # was committed without rebuilding the .js / .d.ts that ship via
        # package.json's `files` field. The check is Node-independent,
        # so it runs on one matrix entry only.
        if: matrix.node-version == '22'
        run: |
          git diff --exit-code -- \
            'reference/sdlc/captain.playbook/captain.*.js' \
            'reference/sdlc/captain.playbook/captain.*.d.ts' \
            'reference/sdlc/code.playbook/code.*.js' \
            'reference/sdlc/code.playbook/code.*.d.ts' \
            'reference/sdlc/code.playbook/playbook-captain.js' \
            'reference/sdlc/code.playbook/playbook-captain.d.ts' \
            'reference/sdlc/code.playbook/worker-evidence.js' \
            'reference/sdlc/code.playbook/worker-evidence.d.ts' \
            'reference/sdlc/review.playbook/review.*.js' \
            'reference/sdlc/review.playbook/review.*.d.ts' \
            'reference/sdlc/decide.playbook/decide.*.js' \
            'reference/sdlc/decide.playbook/decide.*.d.ts' \
            'reference/sdlc/dev.playbook/dev.*.js' \
            'reference/sdlc/dev.playbook/dev.*.d.ts' \
            'reference/sdlc/branch.playbook/branch.*.js' \
            'reference/sdlc/branch.playbook/branch.*.d.ts' \
            'reference/sdlc/pr.playbook/pr.*.js' \
            'reference/sdlc/pr.playbook/pr.*.d.ts' \
            'reference/sdlc/inspect.playbook/inspect.*.js' \
            'reference/sdlc/inspect.playbook/inspect.*.d.ts' \
            'src/accepted-outcome.js' \
            'src/accepted-outcome.d.ts' \
            'src/script-output.js' \
            'src/script-output.d.ts' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts' \
            'src/xstate-playbook-runtime.js' \
            'src/xstate-playbook-runtime.d.ts'
          if [ -n "$(git status --porcelain -- \
            'reference/sdlc/captain.playbook' \
            'reference/sdlc/code.playbook' \
            'reference/sdlc/review.playbook' \
            'reference/sdlc/decide.playbook' \
            'reference/sdlc/dev.playbook' \
            'reference/sdlc/branch.playbook' \
            'reference/sdlc/pr.playbook' \
            'reference/sdlc/inspect.playbook' \
            'src/accepted-outcome.js' \
            'src/accepted-outcome.d.ts' \
            'src/script-output.js' \
            'src/script-output.d.ts' \
            'src/runtime.js' \
            'src/runtime.d.ts' \
            'src/xstate-runtime.js' \
            'src/xstate-runtime.d.ts' \
            'src/xstate-playbook-runtime.js' \
            'src/xstate-playbook-runtime.d.ts')" ]; then
            git status --short -- \
              'reference/sdlc/captain.playbook' \
              'reference/sdlc/code.playbook' \
              'reference/sdlc/review.playbook' \
              'reference/sdlc/decide.playbook' \
              'reference/sdlc/dev.playbook' \
              'reference/sdlc/branch.playbook' \
              'reference/sdlc/pr.playbook' \
              'reference/sdlc/inspect.playbook' \
              'src/accepted-outcome.js' \
              'src/accepted-outcome.d.ts' \
              'src/script-output.js' \
              'src/script-output.d.ts' \
              'src/runtime.js' \
              'src/runtime.d.ts' \
              'src/xstate-runtime.js' \
              'src/xstate-runtime.d.ts' \
              'src/xstate-playbook-runtime.js' \
              'src/xstate-playbook-runtime.d.ts'
            exit 1
          fi

  licensing:
    name: SPDX headers (LIC-3, LIC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify SPDX headers on git-tracked files
        run: bash scripts/check-spdx.sh

  smoke:
    name: Smoke install (global tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pack the publishable tarball
        # Same artifact `npm publish` would upload; uses package.json's
        # `files` array. No build step needed — `.js` / `.d.ts`
        # siblings are committed and pinned by the drift check above.
        run: npm pack --pack-destination /tmp

      - name: Verify automatic SDK installation and ownership
        env:
          PLAYBOOK_SDK_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/playbook-sdk-smoke
        run: |
          TARBALL=$(ls /tmp/sublang-playbook-*.tgz)
          node scripts/smoke-sdk-installation.mjs "$TARBALL"
      - name: Retain SDK installation receipts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sdk-installation-smoke
          path: ${{ runner.temp }}/playbook-sdk-smoke/*.json
          if-no-files-found: ignore

  windows-storage:
    name: Windows storage (Node 22.19)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Drop dev-only workspace override
        shell: pwsh
        run: if (Test-Path pnpm-workspace.yaml) { Remove-Item pnpm-workspace.yaml }
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check native Windows storage and directory handles
        run: pnpm exec vitest run reference/sdlc/code.playbook/windows-storage.integration.test.ts reference/sdlc/code.playbook/private-paths.integration.test.ts
